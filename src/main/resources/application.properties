# Port - matches old TypeScript BFF default
quarkus.http.port=9002

# Full backend base URL — must not include a trailing slash
# Accepts a single BACKEND_URL, or falls back to composing BE_RTF_MANUELL_URL + BE_RULE_PATH (old .env vars)
quarkus.rest-client.backend.url=${BACKEND_URL:${BE_RTF_MANUELL_URL:http://localhost:8080}/${BE_RULE_PATH:regel/rtf-manuell}}

# CORS - allow the frontend to call this BFF
quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3030}
quarkus.http.cors.methods=GET,PUT,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Container image
quarkus.container-image.build=true
quarkus.container-image.name=rimfrost-regel-rtf-manuell-bff
quarkus.container-image.group=rimfrost
quarkus.container-image.tag=latest
quarkus.container-image.push=false
